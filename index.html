                    { time: "19:30", description: "晚餐：【黑毛和牛大餐】 🥩 (松阪牛 M / 燒肉力丸) - 務必提前一個月訂位！", landmark: true, query: "大阪和牛餐廳" },

                    { time: "點心", description: "必吃 大阪炸串 (Kushikatsu)，推薦「達摩炸串」", landmark: false },

                events: [
                    { time: "09:30", description: "退房，行李可寄放飯店或拉至車站寄放", landmark: false },
                    { time: "10:00", description: "難波周邊找間咖啡廳享用悠閒早餐", landmark: false },
                    { time: "11:30", description: "搭乘南海電鐵 前往關西機場", landmark: false },
                    { time: "13:30", description: "搭機返台，帶著滿滿回憶（和戰利品）回家！", landmark: false },
                ] 
            },
        ];

        // --- HARDCODED LANDMARK INFO (Fallback Descriptions) ---
        const HARDCODED_INFO = {
            "難波八阪神社": "巨大且震撼的獅子頭形狀的舞殿是神社的最大特色，據說能吞噬厄運並帶來勝利。",
            "道頓堀": "大阪最著名的地標，以「食倒」文化聞名，Glico跑跑人招牌和各種誇張的立體招牌是必看亮點。",
            "伏見稻荷大社": "以綿延不絕的朱紅色「千本鳥居」聞名，是京都代表性的景點之一，充滿神秘的宗教氛圍。",
            "錦市場": "被譽為「京都的廚房」，擁有數百年歷史，販售各種新鮮海產、京野菜、漬物和獨特小吃。",
            "清水寺": "京都最古老的寺院，著名的「清水舞台」由數百根木柱支撐，可俯瞰京都市景，是世界文化遺產。",
            "星巴克京都二寧坂茶屋店": "全球首間榻榻米座位的星巴克，完美融合了傳統日式町家建築與現代咖啡文化。",
            "天橋立": "日本三景之一，一個全長約3.6公里的沙洲，形狀看似一道連結天地的橋樑，適合從高處倒頭觀看。",
            "伊根舟屋": "沿著海灣建造的獨特日式傳統建築，一樓是船庫，二樓是生活空間，被譽為「海之京都」。",
            "神戶布引香草園": "位於山頂，是日本最大的香草園之一，可以搭乘纜車上山，眺望神戶市景與港口。",
            "北野異人館街": "保留了明治時代外國人居住的西式建築群，風格獨特，充滿異國情調。",
            "神戶港": "充滿現代感的港灣地區，以紅色地標神戶塔和 Mosaic 廣場聞名，是欣賞神戶百萬夜景的絕佳地點。",
            "Grand Front Osaka": "梅田的大型複合式商業設施，包括無印良品全球旗艦店等，是購物和美食的集中地。",
            "心齋橋": "大阪最繁華的購物街之一，聚集了藥妝店、時尚品牌和各種特色小店。",
            "大阪和牛餐廳": "在大阪，您可以享用到頂級的黑毛和牛，如松阪牛或神戶牛，是肉食愛好者的天堂。",
            "黑門市場": "被稱為「大阪人的廚房」，以新鮮的海鮮、河豚、和牛和各種在地小吃聞名。",
            "千日前道具街": "專門販售廚房用品、餐具和食物模型的街道，是餐飲業者的天堂，也是購買伴手禮的好去處。",
            "通天閣 新世界": "大阪的象徵性地標，位於充滿懷舊昭和風情的新世界地區，可以登上展望台俯瞰城市。",
        };
        
        // --- Gemini API Utilities for Landmark Info, Weather, and Exchange Rate ---
        const callGeminiApi = async (prompt, systemInstruction, isExchangeRate = false) => {
            const apiKey = ""; // API key is handled by the environment
            const modelName = "gemini-2.5-flash-preview-09-2025";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                tools: [{ "google_search": {} }],
                systemInstruction: {
                    parts: [{ text: systemInstruction }]
                },
            };

            for (let i = 0; i < MAX_RETRIES; i++) {
                try {
                    const delay = Math.pow(2, i) * 1000;
                    if (i > 0) await new Promise(resolve => setTimeout(resolve, delay));

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        if (response.status === 429 && i < MAX_RETRIES - 1) continue;
                        throw new Error(`API call failed with status: ${response.status}`);
                    }

                    const result = await response.json();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text?.trim();

                    if (text) {
                        if (isExchangeRate) {
                            const match = text.match(/[\d.]+/);
                            return match ? parseFloat(match[0]) : 'ERROR';
                        }
                        return text;
                    }
                    return 'ERROR';

                } catch (error) {
                    console.error("API call failed:", error);
                    if (i === MAX_RETRIES - 1) return "ERROR";
                }
            }
            return "ERROR";
        };
        
        // Component: LandmarkInfo (景點介紹查詢元件)
        const LandmarkInfo = ({ query }) => {
            const [info, setInfo] = useState(HARDCODED_INFO[query] || "無簡短描述。");
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [queried, setQueried] = useState(false);

            const fetchLandmarkInfo = async (query) => {
                const prompt = `以繁體中文，用一到兩句話簡述日本景點 ${query} 的特色。`;
                const system = "你是一個旅遊嚮導。請根據景點名稱，提供簡潔、吸引人且適合旅遊手冊的景點介紹。只輸出簡介內容，不要加入任何標題或多餘的文字。";
                return callGeminiApi(prompt, system);
            };

            const getInfo = useCallback(async () => {
                setLoading(true);
                setError(null);
                setInfo(null);
                const result = await fetchLandmarkInfo(query);
                if (result && result !== 'ERROR') {
                    setInfo(result);
                    setQueried(true);
                } else {
                    setError("無法連線至查詢服務，請檢查網路。");
                    setInfo(HARDCODED_INFO[query] || "無簡短描述。");
                }
                setLoading(false);
            }, [query]);

            return (
                <div className="mt-3 pt-3 border-t border-rose-100">
                    <p className="text-xs font-bold text-rose-600 mb-1">【景點特色】</p>
                    
                    {loading ? (
                        <div className="flex items-center text-sm text-rose-500">
                            <svg className="animate-spin -ml-1 mr-2 h-4 w-4 text-rose-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                            正在查詢景點特色...
                        </div>
                    ) : (
                        <p className="text-sm text-gray-700 leading-relaxed">{info}</p>
                    )}

                    {error && <p className="text-xs text-red-500 mt-2">*{error}</p>}
                    
                    {!queried && !loading && (
                        <button 
                            onClick={getInfo}
                            className="mt-3 text-xs font-semibold text-indigo-600 hover:text-indigo-800 transition duration-150 border-b border-dashed border-indigo-200"
                        >
                            嘗試即時查詢最新特色 🌐
                        </button>
                    )}
                </div>
            );
        };

        // Component: EventCard (行程卡片)
        const EventCard = ({ event }) => (
            <div className="bg-white p-4 rounded-xl shadow-lg hover:shadow-xl transition duration-300 transform hover:scale-[1.01] border border-rose-100">
                <p className="text-sm font-semibold text-gray-800">{event.description}</p>
                {event.landmark && event.query && <LandmarkInfo query={event.query} />}
            </div>
        );

        // Component: UtilityCard (即時資訊卡片)
        const UtilityCard = () => {
            // Define cities for selection
            const CITIES = [
                { name: '大阪難波', label: '大阪難波' },
                { name: '京都', label: '京都' },
                { name: '神戶', label: '神戶' },
            ];

            // State for selected city, default to the main base
            const [selectedCity, setSelectedCity] = useState(CITIES[0].name); 

            // State for Weather
            const [weather, setWeather] = useState("點擊城市按鈕查詢天氣");
            const [weatherLoading, setWeatherLoading] = useState(false);
            
            // State for Exchange Rate (Rate is TWD per 1 JPY)
            const [rate, setRate] = useState(null); 
            const [jpyInput, setJpyInput] = useState(''); 
            const [rateLoading, setRateLoading] = useState(false);
            
            // --- Fetch Weather ---
            const fetchWeather = useCallback(async (city) => {
                setWeatherLoading(true);
                // Dynamically update the prompt with the selected city
                const prompt = `現在${city}的天氣狀況、溫度和體感，請用一句話簡述。例如：『目前晴朗，溫度 25°C，體感舒適。』`;
                const system = "你是一個即時天氣播報員，根據最新的網路查詢結果，以繁體中文簡潔地回答。只輸出描述內容。";
                
                // Clear weather display while fetching new data
                setWeather('查詢中...'); 

                const result = await callGeminiApi(prompt, system);
                setWeather(result === 'ERROR' ? '無法取得即時天氣' : result);
                setWeatherLoading(false);
            }, []);

            // Handle city change and trigger weather fetch
            const handleCityChange = (city) => {
                setSelectedCity(city);
                fetchWeather(city);
            };

            // --- Fetch Exchange Rate (JPY to TWD) ---
            const fetchExchangeRate = useCallback(async () => {
                setRateLoading(true);
                // Prompt to get JPY to TWD rate (TWD per 1 JPY)
                const prompt = "日圓 (JPY) 兌換台灣新台幣 (TWD) 的即時匯率是多少？（例如：1 JPY = X TWD）。請只輸出數字 X，精確到小數點後四位。";
                const system = "你是一個金融數據機器人，請提供最新的 JPY 兌換 TWD 的數字。";
                const result = await callGeminiApi(prompt, system, true); // true for isExchangeRate
                
                if (typeof result === 'number') {
                    setRate(result); // result is TWD per 1 JPY
                } else {
                    setRate(null);
                    console.error("Failed to parse exchange rate:", result);
                }
                setRateLoading(false);
            }, []);

            useEffect(() => {
                // Initial fetch for utilities (default to selectedCity)
                fetchWeather(selectedCity);
                fetchExchangeRate();
            }, [fetchWeather, fetchExchangeRate]);

            // Calculation: TWD Output = JPY Input * Rate (TWD/JPY)
            const twdOutput = rate && jpyInput ? (parseFloat(jpyInput) * rate).toFixed(2) : '0.00';
            const displayRate = rate ? rate.toFixed(4) : 'N/A'; // Use 4 decimal places for precision

            // --- Utility UI ---
            return (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {/* 1. Weather Card (Multi-city selector) */}
                    <div className="bg-white p-5 rounded-3xl shadow-lg border-2 border-indigo-200">
                        <div className="flex items-center text-indigo-600 mb-2">
                            <svg className="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.975 4 4 0 10-7.75 1.764L7 15h2.529a4 4 0 01-.5-1.928M12 11V6M9 9l3-3 3 3"></path></svg>
                            <h3 className="font-bold text-lg">即時天氣 ({selectedCity})</h3> 
                        </div>

                        {/* City Selection Buttons */}
                        <div className="flex space-x-2 mb-3 overflow-x-auto hide-scrollbar">
                            {CITIES.map((city) => (
                                <button
                                    key={city.name}
                                    onClick={() => handleCityChange(city.name)}
                                    // Dynamic styling based on selection
                                    className={`flex-shrink-0 text-xs px-3 py-1 rounded-full font-medium transition ${
                                        selectedCity === city.name
                                            ? 'bg-indigo-600 text-white shadow-md'
                                            : 'bg-indigo-100 text-indigo-700 hover:bg-indigo-200'
                                    }`}
                                    disabled={weatherLoading} // Disable while loading
                                >
                                    {city.label}
                                </button>
                            ))}
                        </div>

                        {/* Weather Display */}
                        {weatherLoading ? (
                            <div className="text-sm text-indigo-400 flex items-center">
                                <svg className="animate-spin -ml-1 mr-2 h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                查詢中...
                            </div>
                        ) : (
                            <p className="text-gray-700 font-medium text-sm">{weather}</p>
                        )}
                        <p className="text-xs text-gray-400 mt-2">*{new Date().toLocaleTimeString('zh-TW')} 資料</p>
                    </div>

                    {/* 2. Exchange Rate Card (JPY to TWD) */}
                    <div className="bg-white p-5 rounded-3xl shadow-lg border-2 border-pink-200">
                        <div className="flex items-center text-pink-600 mb-2">
                            <svg className="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8V8m0 8v-8"></path></svg>
                            <h3 className="font-bold text-lg">日圓匯率換算 (JPY ➝ TWD)</h3> 
                        </div>
                        {rateLoading ? (
                            <div className="text-sm text-pink-400 flex items-center">
                                <svg className="animate-spin -ml-1 mr-2 h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                查詢中...
                            </div>
                        ) : rate ? (
                            <div className="mt-2">
                                <p className="text-sm font-semibold text-gray-600 mb-2">
                                    即時匯率: 1 JPY = {displayRate} TWD
                                </p>
                                <div className="flex items-center space-x-2">
                                    <input
                                        type="number"
                                        value={jpyInput}
                                        onChange={(e) => setJpyInput(e.target.value)}
                                        placeholder="輸入日幣金額 (¥)..." 
                                        className="w-1/2 p-2 border border-pink-300 rounded-lg text-sm focus:ring-pink-500 focus:border-pink-500 transition"
                                    />
                                    <span className="text-lg font-bold text-gray-800">=</span>
                                    <div className="w-1/2 p-2 bg-pink-50 rounded-lg text-sm font-extrabold text-pink-700 text-right shadow-inner">
                                        NT$ {twdOutput} 
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <p className="text-red-500 text-sm">無法取得匯率資訊</p>
                        )}
                    </div>
                </div>
            );
        }

        // Component: App (Main Layout)
        const App = () => {
            const [activeDay, setActiveDay] = useState(tripData[0].day);

            // Find the active day's data
            const currentDay = tripData.find(d => d.day === activeDay);

            return (
                <div className="max-w-xl mx-auto min-h-screen pb-4">
                    {/* Header (Sticky for navigation) */}
                    <header className="py-6 px-4 bg-white shadow-lg sticky top-0 z-20 rounded-b-3xl mb-4">
                        <h1 className="text-3xl font-extrabold text-pink-700">
                            🌸 關西姊妹淘七日悠閒之旅
                        </h1>
                        <p className="text-sm text-gray-500 mt-1">
                            2026年 5月10日 (六) ～ 5月16日 (五)
                        </p>
                    </header>

                    <main className="px-4 space-y-8">
                        
                        {/* Utility Card (Weather & Exchange Rate) */}
                        <UtilityCard />

                        {/* Trip Introduction */}
                        <div className="bg-white p-6 rounded-3xl shadow-2xl border border-pink-200">
                            <h2 className="text-2xl font-bold text-pink-600 mb-3 flex items-center">
                                <svg className="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                行程總覽 (簡介)
                            </h2>
                            <p className="text-gray-700 leading-relaxed text-sm">{TRIP_SUMMARY}</p>
                            <p className="mt-3 text-xs text-gray-500 italic">住宿：全程連住東橫INN 大阪難波西（或難波周邊飯店）</p>
                        </div>

                        {/* Day Tabs (Sticky for easy switching) */}
                        <div className="hide-scrollbar overflow-x-auto whitespace-nowrap py-3 sticky top-24 bg-rose-50 z-10 -mx-4 px-4 shadow-inner">
                            {tripData.map(day => (
                                <button
                                    key={day.day}
                                    onClick={() => setActiveDay(day.day)}
                                    className={`inline-block px-4 py-2 mx-1 rounded-full text-sm font-semibold transition-all shadow-md transform hover:scale-[1.05] ${
                                        day.day === activeDay 
                                            ? 'bg-rose-500 text-white shadow-rose-400/50' 
                                            : 'bg-white text-rose-600 border border-rose-200 hover:bg-rose-100'
                                    }`}
                                >
                                    Day {day.day}
                                </button>
                            ))}
                        </div>

                        {/* Current Day Itinerary */}
                        <div key={activeDay} className="fade-in bg-white p-6 rounded-3xl shadow-2xl">
                            <h2 className="text-3xl font-bold text-gray-800 mb-2">{currentDay.title}</h2>
                            <p className="text-md font-semibold text-rose-500 mb-4">
                                {currentDay.date} @ {currentDay.location}
                            </p>
                            
                            {/* Timeline */}
                            <div className="relative border-l-2 border-rose-100 ml-3 space-y-8 my-6">
                                {currentDay.events.map((event, idx) => (
                                    <div key={idx} className="relative pl-8">
                                        <div className="absolute -left-[9px] top-0 w-4 h-4 rounded-full bg-rose-500 border-4 border-rose-100 shadow-lg"></div>
                                        <span className="inline-block px-2 py-0.5 rounded-full bg-rose-100 text-rose-600 text-xs font-bold mb-1 shadow-sm">
                                            {event.time}
                                        </span>
                                        <EventCard event={event} />
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Footer */}
                        <div className="text-center text-rose-300 text-xs pb-10">
                            Made with ❤️ for Sisters Trip 2026
                            <br/>景點介紹已內建，天氣與匯率為即時網路查詢結果。
                        </div>

                    </main>
                </div>
            );
        };

        // Render the App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
