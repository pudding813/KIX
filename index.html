<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;

        // Firebase & Firestore Global Variables Setup (as required by environment - currently unused but kept for compliance)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        /**
         * 關西姊妹淘七日悠閒之旅 行程表 (Day 1 - Day 7) - 最終確認版 (2026/5/10-5/16)

                    { time: "15:00", name: "飯店 Check-in", description: "飯店 Check-in（放行李、補妝）。住宿：東橫INN 大阪難波西。", location: "難波" },

                ]
            },
            {

                theme: "京都經典：千本鳥居 & 清水舞台",
                events: [
                    { time: "09:00", name: "從難波出發前往京都", description: "搭乘 JR 或其他交通工具前往京都。", location: "京都" },
                    { time: "10:00", name: "伏見稻荷大社 ⛩️", description: "走進綿延不絕的紅色千本鳥居隧道。", location: "伏見稻荷" },
                    { time: "12:00", name: "錦市場 (午餐)", description: "京都的廚房，邊走邊吃（豆乳甜甜圈、三木雞卵、炸魚板）。", location: "錦市場" },

                    { time: "16:00", name: "星巴克京都二寧坂茶屋店", description: "推薦下午茶，體驗榻榻米座位。", location: "二寧坂" },
                    { time: "19:00", name: "回到大阪難波吃晚餐", description: "返回大阪難波，自由選擇晚餐地點。", location: "難波" },
                ]
            },
            {
                day: 3,
                date: "星期一 (5/12)",
                theme: "海之京都：天橋立 & 伊根舟屋 (跟團)",
                events: [
                    { time: "07:20", name: "難波集合 (跟團)", description: "難波集合 (OCAT 或 VIP Villa，視報名的團而定)。", location: "難波集合點" },

                    { time: "18:30", name: "巴士回到難波解散", description: "結束一日遊行程。", location: "難波" },
                    { time: "晚餐", name: "簡單晚餐，早點休息", description: "在飯店附近便利商店或吉野家簡單吃，早點休息。", location: "難波" },
                ]
            },
            {
                day: 4,
                date: "星期二 (5/13)",
                theme: "神戶優雅行：花園與夜景",
                events: [
                    { time: "10:00", name: "前往神戶三宮", description: "搭阪神電車前往神戶三宮。", location: "神戶三宮" },
                    { time: "10:30", name: "神戶布引香草園 🌸", description: "搭乘夢幻空中纜車上山，看海景、聞花香，非常療癒。", location: "神戶" },
                    { time: "14:00", name: "北野異人館街 🏠", description: "參觀風見雞之館、萌黃之館（充滿異國風情的洋房）。", location: "北野異人館街" },
                    { time: "16:00", name: "神戶港 Mosaic 廣場 🎡", description: "看麵包超人博物館(外觀)、神戶塔點燈。", location: "神戶港" },
                    { time: "18:00", name: "欣賞神戶百萬夜景", description: "欣賞著名的神戶百萬夜景，後返回難波。", location: "神戶港" },

            },
            {

                    { time: "15:30", name: "戰利品拿回難波飯店放", description: "先把戰利品拿回難波飯店放，減輕負重。", location: "難波" },
                    { time: "16:30", name: "心齋橋補貨", description: "藥妝、Uniqlo、零食等。", location: "心齋橋" },
                    { time: "19:30", name: "晚餐：黑毛和牛大餐 🥩", description: "推薦：松阪牛燒肉 M (法善寺橫丁) 或 燒肉力丸。務必提前一個月訂位！", location: "法善寺橫丁" },
                ]
            },
            {
                day: 6,
                date: "星期四 (5/15)",
                theme: "老大阪風情：市場與通天閣",
                events: [
                    { time: "10:00", name: "黑門市場 🦀 (早午餐)", description: "現烤扇貝、海膽、神戶牛串燒、水果大福。", location: "黑門市場" },
                    { time: "12:30", name: "千日前道具街 🍳", description: "看看超逼真的食物模型、日本製的精緻廚具。", location: "千日前" },
                    { time: "15:00", name: "新世界 & 通天閣 🗼", description: "充滿昭和復古味，誇張的立體招牌。", location: "新世界" },
                    { time: "16:00", name: "點心：大阪炸串", description: "必吃 大阪炸串 (Kushikatsu)，推薦「達摩炸串」。", location: "新世界" },
                    { time: "晚餐", name: "道頓堀最後巡禮 (大阪燒)", description: "在道頓堀享受最後一次經典大阪燒。", location: "道頓堀" },
                ]
            },
            {
                day: 7,
                date: "星期五 (5/16)",
                theme: "收心回家",
                events: [
                    { time: "09:30", name: "退房與行李寄放", description: "退房，行李可寄放飯店或拉至車站寄放。", location: "難波" },
                    { time: "10:00", name: "悠閒早餐", description: "難波周邊找間咖啡廳享用悠閒早餐。", location: "難波" },
                    { time: "11:30", name: "搭乘南海電鐵 前往關西機場", description: "前往 KIX。", location: "難波" },
                    { time: "13:30", name: "搭機返台", description: "帶著滿滿回憶（和戰利品）回家！", location: "KIX" },
                ]
            }
        ];

        // --- Utility Components ---

        const Header = ({ title }) => (
            <header className="bg-rose-500 text-white p-4 shadow-lg sticky top-0 z-10 rounded-b-xl">
                <h1 className="text-xl font-bold text-center tracking-wider">{title}</h1>
            </header>
        );

        const DaySelector = ({ days, activeDay, setActiveDay }) => (
            <div className="flex overflow-x-auto hide-scrollbar p-3 space-x-2 bg-rose-100/50 shadow-inner sticky top-14 z-10">
                {days.map((dayData) => (
                    <button
                        key={dayData.day}
                        onClick={() => setActiveDay(dayData.day)}
                        className={`
                            px-4 py-2 text-sm font-semibold rounded-full whitespace-nowrap transition-all duration-300
                            ${activeDay === dayData.day
                                ? 'bg-rose-500 text-white shadow-md transform scale-105'
                                : 'bg-white text-rose-600 hover:bg-rose-200/80'
                            }
                        `}
                    >
                        Day {dayData.day} <span className="text-xs">({dayData.date.split(' ')[0]})</span>
                    </button>
                ))}
            </div>
        );

        const EventCard = ({ event }) => (
            <div className="bg-white p-4 rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-330 relative z-0 border-t-4 border-rose-400">
                <h3 className="text-lg font-bold text-gray-800 mb-1">{event.name}</h3>
                <p className="text-sm text-gray-600 mb-2">{event.description}</p>
                {event.location && (
                    <div className="flex items-center text-xs text-rose-500 font-medium bg-rose-50 px-2 py-1 rounded-full w-fit">
                        <span className="mr-1">📍</span> {event.location}
                    </div>
                )}
            </div>
        );

        // --- Currency Converter Component ---

        const CurrencyConverter = ({ fetchExchangeRate }) => {
            const [rate, setRate] = useState(null);
            const [jpyAmount, setJpyAmount] = useState(10000);
            const [isLoading, setIsLoading] = useState(false);
            const [apiError, setApiError] = useState(null);
            const [lastUpdated, setLastUpdated] = useState(null);

            // Fetch the rate on mount
            useEffect(() => {
                handleFetchRate();
            }, []); // eslint-disable-line react-hooks/exhaustive-deps

            const handleFetchRate = useCallback(async () => {
                setApiError(null);
                setIsLoading(true);

                const result = await fetchExchangeRate();
                
                if (result.error) {
                    setApiError(result.error);
                } else if (result.rate) {
                    setRate(result.rate);
                    setLastUpdated(new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false }));
                } else {
                    setApiError("無法解析匯率數據，請嘗試重新整理。");
                }
                
                setIsLoading(false);
            }, [fetchExchangeRate]);

            const convertedTwd = useMemo(() => {
                const amount = parseFloat(jpyAmount);
                if (rate && !isNaN(amount) && amount >= 0) {
                    return (amount * rate).toFixed(2);
                }
                return '0.00';
            }, [jpyAmount, rate]);

            return (
                // Compact Layout for Converter
                <div className="p-4 mb-6 bg-white rounded-2xl shadow-xl border border-pink-300">
                    <div className="flex justify-between items-start mb-3 border-b pb-2">
                        <h2 className="text-lg font-bold text-pink-600 flex items-center">
                            <span className="text-xl mr-2">💰</span> JPY 兌 TWD
                        </h2>
                        <div className="text-right">
                            <p className="text-sm font-semibold text-gray-700">
                                1 JPY ≈ <span className="text-pink-600">{rate ? rate.toFixed(4) : '---'}</span> TWD
                            </p>
                            <p className="text-xs text-gray-400 mt-0.5">
                                更新: {lastUpdated || '載入中...'}
                                <button 
                                    onClick={handleFetchRate} 
                                    disabled={isLoading}
                                    className={`ml-1 text-pink-500 hover:text-pink-700 transition-colors ${isLoading ? 'opacity-50' : ''}`}
                                    title="重新整理匯率"
                                >
                                    {isLoading ? <span className="text-xs animate-spin">🌀</span> : '🔄'}
                                </button>
                            </p>
                        </div>
                    </div>

                    {apiError && (
                        <p className="text-red-500 text-center mb-3 p-2 text-sm bg-red-50 rounded-lg">
                            ❌ {apiError}
                        </p>
                    )}

                    <div className="flex flex-col sm:flex-row items-center space-y-3 sm:space-y-0 sm:space-x-3 animate-fade-in">
                        {/* JPY Input */}
                        <div className="flex items-center w-full sm:w-1/2">
                            <input
                                type="number"
                                inputMode="numeric"
                                pattern="[0-9]*"
                                value={jpyAmount}
                                onChange={(e) => setJpyAmount(e.target.value)}
                                className="w-full p-2 border border-pink-300 rounded-l-lg text-base text-gray-800 focus:outline-none focus:border-pink-500 transition duration-150"
                                placeholder="日幣金額"
                                min="0"
                            />
                            <span className="p-2 bg-pink-500 text-white rounded-r-lg font-bold text-sm">JPY</span>
                        </div>

                        {/* Result Display */}
                        <div className="flex items-center w-full sm:w-1/2 justify-between p-2 bg-pink-50 rounded-lg border border-pink-200 shadow-inner">
                            <span className="text-sm text-gray-700">TWD 約:</span>
                            <span className="text-xl font-extrabold text-rose-700">
                                {convertedTwd}
                            </span>
                        </div>
                    </div>
                </div>
            );
        };
        // --- End Currency Converter Component ---

        // --- Weather Feature Components and Logic ---

        const WeatherIcon = ({ condition }) => {
            let icon = '☀️'; // Default: Sun
            let color = 'text-yellow-500';

            // Check for Chinese and English keywords
            if (condition.includes('雨') || condition.includes('Rain') || condition.includes('shower')) {
                icon = '🌧️';
                color = 'text-blue-500';
            } else if (condition.includes('雲') || condition.includes('Cloudy') || condition.includes('partly')) {
                icon = '☁️';
                color = 'text-gray-500';
            } else if (condition.includes('雪') || condition.includes('Snow')) {
                icon = '❄️';
                color = 'text-cyan-500';
            } else if (condition.includes('晴') || condition.includes('Clear')) {
                icon = '🌞';
                color = 'text-orange-500';
            }

            return <span className={`text-5xl ${color}`}>{icon}</span>;
        };

        const WeatherResultCard = ({ data }) => {
            return (
                <div className="p-4 rounded-xl flex items-center justify-between text-left shadow-lg bg-rose-50/70 border border-rose-200 animate-fade-in">
                    <div className="flex items-center space-x-4">
                        <WeatherIcon condition={data.text} />
                        <div>
                            <h3 className="font-bold text-xl text-gray-800">{data.city}</h3>
                            <p className="text-sm text-gray-600 mt-1 max-w-[200px] overflow-hidden line-clamp-2" title={data.text}>
                                {data.text}
                            </p>
                        </div>
                    </div>
                    
                    {data.sources && data.sources.length > 0 && (
                        <a 
                            href={data.sources[0].uri} 
                            target="_blank" 
                            rel="noopener noreferrer" 
                            className="text-xs text-rose-400 hover:text-rose-600 mt-2 ml-4 truncate max-w-[80px]"
                            title={`數據來源: ${data.sources[0].title}`}
                        >
                            數據來源
                        </a>
                    )}
                </div>
            )
        }

        const WeatherWidget = ({ fetchWeather }) => {
            const cities = useMemo(() => ['大阪難波', '京都', '神戶'], []);
            const [selectedCity, setSelectedCity] = useState(cities[0]); 
            const [allWeatherData, setAllWeatherData] = useState({});
            const [localIsLoading, setLocalIsLoading] = useState(false);
            const [localApiError, setLocalApiError] = useState(null);

            const handleFetchCityWeather = useCallback(async (city) => {
                setLocalIsLoading(true);
                setLocalApiError(null);
                const result = await fetchWeather(city); // Call the parent function

                if (result.error) {
                    setLocalApiError(`查詢 ${city} 天氣失敗。`);
                }

                setAllWeatherData(prev => ({ ...prev, [city]: result }));
                setLocalIsLoading(false);
            }, [fetchWeather]);

            useEffect(() => {
                // Only fetch if data doesn't exist for the selected city
                if (!allWeatherData[selectedCity]) {
                    handleFetchCityWeather(selectedCity);
                }
            }, [selectedCity, allWeatherData, handleFetchCityWeather]);

            const now = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
            const currentData = allWeatherData[selectedCity];

            return (
                <div className="p-4 mb-6 bg-white rounded-2xl shadow-xl border border-rose-200">
                    <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-4 border-b pb-4">
                        <h2 className="text-xl font-bold text-rose-600 flex items-center mb-3 sm:mb-0">
                            <span className="text-2xl mr-2">🌏</span> 關西即時氣象 ({now})
                        </h2>
                        <div className="flex space-x-2">
                            {cities.map(city => (
                                <button
                                    key={city}
                                    onClick={() => setSelectedCity(city)}
                                    className={`
                                        px-3 py-1 text-sm font-medium rounded-full transition-colors duration-200
                                        ${selectedCity === city 
                                            ? 'bg-rose-500 text-white shadow-md' 
                                            : 'bg-rose-100 text-rose-600 hover:bg-rose-200'
                                        }
                                    `}
                                    disabled={localIsLoading}
                                >
                                    {/* Only use the first character for compactness in the selector */}
                                    {city.split('')[0]}
                                </button>
                            ))}
                            <button 
                                onClick={() => handleFetchCityWeather(selectedCity)} 
                                disabled={localIsLoading}
                                className={`p-2 rounded-full transition-all flex items-center justify-center ${localIsLoading ? 'bg-gray-200 text-gray-500' : 'bg-rose-100 text-rose-500 hover:bg-rose-200'}`}
                                title="重新整理當前城市天氣"
                            >
                                {localIsLoading ? <span className="text-xl animate-spin">🌀</span> : '🔄'}
                            </button>
                        </div>
                    </div>

                    {localApiError && (
                        <p className="text-red-500 text-center mb-3 p-2 text-sm bg-red-50 rounded-lg">
                            ❌ {localApiError}
                        </p>
                    )}

                    {localIsLoading && !currentData && (
                        <div className="flex justify-center items-center p-8 text-rose-500">
                            <span className="text-2xl animate-spin mr-2">🌀</span> 正在查詢 {selectedCity} 天氣...
                        </div>
                    )}

                    {currentData && !localIsLoading && (
                        <WeatherResultCard data={currentData} />
                    )}

                    {!currentData && !localIsLoading && !localApiError && (
                        <div className="text-center text-gray-500 p-4">
                            請選擇一個城市查詢即時天氣。
                        </div>
                    )}
                </div>
            );
        };
        // --- End Weather Widget ---


        // --- Main App Component ---

        const App = () => {
            const [activeDay, setActiveDay] = useState(initialItinerary[0].day);
            
            // Core Fetching function for Gemini API (Weather/Rate)
            const geminiFetch = useCallback(async (userQuery, systemPrompt) => {
                const apiKey = "";
                const model = 'gemini-2.5-flash-preview-09-2025';
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

                const payload = {
                    contents: [{ parts: [{ text: userQuery }] }],
                    tools: [{ "google_search": {} }],
                    systemInstruction: {
                        parts: [{ text: systemPrompt }]
                    },
                };

                let attempts = 0;
                const maxAttempts = 3;
                while (attempts < maxAttempts) {
                    try {
                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }

                        const result = await response.json();
                        const candidate = result.candidates?.[0];

                        if (candidate && candidate.content?.parts?.[0]?.text) {
                            const text = candidate.content.parts[0].text;
                            let sources = [];
                            const groundingMetadata = candidate.groundingMetadata;
                            if (groundingMetadata && groundingMetadata.groundingAttributions) {
                                sources = groundingMetadata.groundingAttributions
                                    .map(attribution => ({ uri: attribution.web?.uri, title: attribution.web?.title }))
                                    .filter(source => source.uri && source.title);
                            }
                            return { text, sources, error: false };
                        }
                        return { text: "", sources: [], error: true, errorMessage: "API回應結構異常。" };

                    } catch (err) {
                        console.error(`Attempt ${attempts + 1} failed for query:`, userQuery, err);
                        attempts++;
                        if (attempts < maxAttempts) {
                            const delay = Math.pow(2, attempts) * 1000;
                            await new Promise(resolve => setTimeout(resolve, delay));
                        }
                    }
                }
                return { text: "", sources: [], error: true, errorMessage: "網路連線或服務查詢失敗。" };
            }, []); 

            // Weather Fetching using the core function
            const fetchWeather = useCallback(async (city) => {
                const systemPrompt = "You are a specialized weather reporter. Provide only the current weather, temperature, and condition for the given location in a concise, single sentence in Chinese (Traditional). Do not include any greetings or extra commentary. Always use Google Search for grounding.";
                const userQuery = `Current weather in ${city} right now.`;
                const result = await geminiFetch(userQuery, systemPrompt);

                if (result.error) {
                    return { city, text: result.errorMessage, sources: [], error: true };
                }
                return { city, text: result.text, sources: result.sources, error: false };
            }, [geminiFetch]);

            // Rate Fetching using the core function - Enhanced Parsing Logic
            const fetchExchangeRate = useCallback(async () => {
                const systemPrompt = "You are a specialized financial data parser. Provide only the current exchange rate for 1 JPY to TWD, formatted precisely as a single number rounded to 4 decimal places, with no units, commentary, or text. For example: '0.2150'.";
                const userQuery = "Current exchange rate for 1 Japanese Yen (JPY) in New Taiwan Dollars (TWD).";
                
                const result = await geminiFetch(userQuery, systemPrompt);

                if (result.error) {
                    return { error: result.errorMessage };
                }

                const rateText = result.text.trim();
                
                // 1. Try to extract a floating point number using regex for robustness
                const match = rateText.match(/(\d+\.\d+)/); 
                let rateValue = NaN;

                if (match) {
                    rateValue = parseFloat(match[1]);
                } else {
                    // 2. Fallback to simple parseFloat if regex fails (in case it returns just the number)
                    rateValue = parseFloat(rateText);
                }

                if (!isNaN(rateValue) && rateValue > 0) {
                    return { rate: rateValue, error: null };
                }
                
                // 3. If parsing fails, return a custom error message
                return { error: `無法解析匯率：API回應為 "${rateText.substring(0, 30)}..."` };
            }, [geminiFetch]);


            const currentDay = initialItinerary.find(d => d.day === activeDay);

            return (
                <div className="min-h-screen">
                    <Header title="關西姊妹淘七日悠閒之旅 (購物氣象專用版)" />

                    <DaySelector 
                        days={initialItinerary} 
                        activeDay={activeDay} 
                        setActiveDay={setActiveDay} 
                    />

                    <main className="p-4 max-w-xl mx-auto">
                        
                        {/* 1. Currency Converter (Compact) */}
                        <CurrencyConverter 
                            fetchExchangeRate={fetchExchangeRate} 
                        />
                        
                        {/* 2. Instant Weather Widget */}
                        <WeatherWidget 
                            fetchWeather={fetchWeather}
                        />

                        {/* 3. Itinerary Details */}
                        <div className="bg-white p-4 rounded-2xl shadow-xl mb-6 animate-fade-in">
                            <h2 className="text-2xl font-bold text-rose-700 mb-2">
                                Day {currentDay.day}: {currentDay.theme}
                            </h2>
                            <p className="text-sm text-gray-500 mb-4">{currentDay.date}</p>

                            {/* Timeline */}
                            <div className="relative border-l-2 border-rose-100 ml-3 space-y-8 my-6">
                                {currentDay.events.map((event, idx) => (
                                    <div key={idx} className="relative pl-8">
                                        <div className="absolute -left-[9px] top-0 w-4 h-4 rounded-full bg-rose-500 border-4 border-rose-100"></div>
                                        <span className="inline-block px-2 py-0.5 rounded bg-rose-100 text-rose-600 text-xs font-bold mb-1 shadow-sm">
                                            {event.time}
                                        </span>
                                        <EventCard event={event} />
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Footer */}
                        <div className="text-center text-rose-300 text-xs pb-10">
                            Made with ❤️ for Sisters Trip 2026
                            <br/>即時資訊由 Google 搜尋提供
                        </div>


                    </main>
                </div>
            );
        };

        // Standard React Bootstrap
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>
</body>
</html>
