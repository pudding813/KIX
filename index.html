<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // --- Global Config and Utilities ---
        
        const LOCAL_STORAGE_KEY = 'kansai_sisters_trip_expenses';
        const DEFAULT_JPY_TO_TWD_RATE = 0.22;
        const MAX_RETRIES = 3;

        // --- FINALIZED TRIP DATA ---
        const TRIP_SUMMARY = "這是一份為你們量身打造、最終定案的【關西姊妹淘七日悠閒之旅 (2026/5/10-5/16)】行程總表。全程連住難波，結合了天橋立跟團的輕鬆、和牛大餐的美味，以及無印良品旗艦店的購物樂趣。這趟旅程主打悠閒不趕路，讓姐妹們能盡情享受京阪神的優雅風情。";
        
        const tripData = [
            { 
                day: 1, date: "5/10 (六)", title: "抵達與震撼獅子頭 🦁", location: "大阪難波", weather: "晴朗，24°C/15°C", 
                events: [
                    { time: "08:55-12:30", description: "飛機抵達關西機場 (KIX)", landmark: false },
                    { time: "13:30", description: "搭乘南海電鐵 Rapi:t 直達難波站", landmark: false },
                    { time: "15:00", description: "飯店 Check-in（放行李、補妝）", landmark: false },

                    { time: "下午茶", description: "星巴克京都二寧坂茶屋店（榻榻米）", landmark: true, query: "星巴克京都二寧坂茶屋店" },
                    { time: "19:00", description: "回到大阪難波吃晚餐", landmark: false },
                ] 
            },
            { 
                day: 3, date: "5/12 (一)", title: "海之京都：天橋立 & 伊根舟屋 (跟團) 🚢", location: "天橋立/伊根", weather: "晴時多雲，22°C/14°C", 
                events: [
                    { time: "07:20", description: "難波集合 (OCAT/VIP Villa，視報名團而定)", landmark: false },
                    { time: "上午", description: "【天橋立】 🚠 搭纜車上「飛龍觀」", landmark: true, query: "天橋立" },
                    { time: "下午", description: "【伊根舟屋】 🛥️ 搭遊覽船、餵海鷗", landmark: true, query: "伊根舟屋" },
                    { time: "18:30", description: "巴士回到難波解散", landmark: false },
                    { time: "晚餐", description: "飯店附近便利商店或吉野家簡單吃，早點休息", landmark: false },
                ] 
            },
            { 
                day: 4, date: "5/13 (二)", title: "神戶優雅行：花園與夜景 🎡", location: "神戶", weather: "晴朗，26°C/18°C", 
                events: [
                    { time: "10:00", description: "搭阪神電車前往神戶三宮", landmark: false },
                    { time: "10:30-13:30", description: "【神戶布引香草園】 🌸 搭纜車、賞花", landmark: true, query: "神戶布引香草園" },
                    { time: "14:00-15:30", description: "【北野異人館街】 🏠 參觀風見雞之館", landmark: true, query: "北野異人館街" },
                    { time: "16:00-19:00", description: "【神戶港 Mosaic 廣場】 🎡 看神戶塔點燈/百萬夜景", landmark: true, query: "神戶港" },
                ] 
            },
            { 
                day: 5, date: "5/14 (三)", title: "旗艦購物 & 黑毛和牛之夜 🥩", location: "大阪梅田/難波", weather: "陣雨，23°C/17°C", 
                events: [
                    { time: "11:00-15:00", description: "梅田商圈 (Grand Front Osaka) - 【無印良品 關西旗艦店】", landmark: true, query: "Grand Front Osaka" },
                    { time: "15:30", description: "先把戰利品拿回難波飯店放", landmark: false },
                    { time: "16:30-18:30", description: "心齋橋補貨（藥妝、Uniqlo、零食）", landmark: true, query: "心齋橋" },
                    { time: "19:30", description: "晚餐：【黑毛和牛大餐】 🥩 (松阪牛 M / 燒肉力丸) - 務必提前一個月訂位！", landmark: true, query: "大阪和牛餐廳" },
                ] 
            },
            { 
                day: 6, date: "5/15 (四)", title: "老大阪風情：市場與通天閣 🗼", location: "大阪難波/新世界", weather: "多雲，24°C/16°C", 
                events: [
                    { time: "10:00-12:00", description: "【黑門市場】 🦀 早午餐：現烤海鮮、和牛串燒", landmark: true, query: "黑門市場" },
                    { time: "12:30-14:30", description: "【千日前道具街】 🍳 逛食物模型、精緻廚具", landmark: true, query: "千日前道具街" },
                    { time: "15:00-17:00", description: "【新世界 & 通天閣】 🗼 充滿昭和復古味", landmark: true, query: "通天閣 新世界" },
                    { time: "點心", description: "必吃 大阪炸串 (Kushikatsu)，推薦「達摩炸串」", landmark: false },
                    { time: "晚餐", description: "道頓堀最後巡禮（大阪燒）", landmark: false },
                ] 
            },
            { 
                day: 7, date: "5/16 (五)", title: "收心回家 ✈️", location: "難波/KIX", weather: "晴朗，27°C/19°C", 
                events: [
                    { time: "09:30", description: "退房，行李可寄放飯店或拉至車站寄放", landmark: false },
                    { time: "10:00", description: "難波周邊找間咖啡廳享用悠閒早餐", landmark: false },
                    { time: "11:30", description: "搭乘南海電鐵 前往關西機場", landmark: false },
                    { time: "13:30", description: "搭機返台，帶著滿滿回憶（和戰利品）回家！", landmark: false },
                ] 
            },
        ];

        // --- Gemini API Utilities for Exchange Rate and Landmark Info ---
        
        // General Gemini API Caller with Google Search grounding
        const callGeminiApi = async (prompt, systemInstruction) => {
            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                tools: [{ "google_search": {} }],
                systemInstruction: {
                    parts: [{ text: systemInstruction }]
                },
            };

            for (let i = 0; i < MAX_RETRIES; i++) {
                try {
                    const delay = Math.pow(2, i) * 1000;
                    if (i > 0) await new Promise(resolve => setTimeout(resolve, delay));

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        if (response.status === 429 && i < MAX_RETRIES - 1) continue;
                        throw new Error(`API call failed with status: ${response.status}`);
                    }

                    const result = await response.json();
                    return result.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || 'ERROR';

                } catch (error) {
                    if (i === MAX_RETRIES - 1) {
                        console.error("Gemini API call failed after multiple retries:", error);
                        return "ERROR";
                    }
                }
            }
            return "ERROR";
        };
        
        // Function to fetch Landmark information
        const fetchLandmarkInfo = async (query) => {
            const prompt = `以繁體中文，用一到兩句話簡述日本景點 ${query} 的特色。`;
            const system = "你是一個旅遊嚮導。請根據景點名稱，提供簡潔、吸引人且適合旅遊手冊的景點介紹。只輸出簡介內容，不要加入任何標題或多餘的文字。";
            return callGeminiApi(prompt, system);
        };

        // --- Hook for Local Storage Data Management ---
        const useLocalExpenses = () => {
            const [expenses, setExpenses] = useState(() => {
                try {
                    const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
                    if (saved) {
                        // 解析並確保 createdAt 是 Date 物件
                        const parsed = JSON.parse(saved);
                        return parsed.map(item => ({
                            ...item,
                            createdAt: new Date(item.createdAt) // 將時間戳字串轉回 Date 物件
                        }));
                    }
                } catch (e) {
                    console.error("Failed to load expenses from localStorage:", e);
                }
                return [];
            });

            // Effect to save data whenever 'expenses' state changes
            useEffect(() => {
                try {
                    // 儲存時將 Date 物件轉為 ISO 字串
                    const dataToSave = expenses.map(item => ({
                        ...item,
                        createdAt: item.createdAt.toISOString()
                    }));
                    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(dataToSave));
                } catch (e) {
                    console.error("Failed to save expenses to localStorage:", e);
                    // 如果儲存失敗，可以考慮通知使用者 (例如: 瀏覽器儲存空間已滿)
                }
            }, [expenses]);
            
            // --- CRUD Operations for Local Storage ---
            
            const addExpense = (item) => {
                const newExpense = {
                    id: crypto.randomUUID(), // 使用 UUID 作為唯一識別碼
                    ...item,
                    jpy: parseFloat(item.jpy),
                    isDone: false,
                    createdAt: new Date(),
                };
                setExpenses(prev => [newExpense, ...prev].sort((a, b) => b.createdAt.getTime() - a.createdAt.getTime()));
            };

            const toggleDone = (id, isDone) => {
                setExpenses(prev => prev.map(item => 
                    item.id === id ? { ...item, isDone: isDone } : item
                ));
            };

            const deleteItem = (id) => {
                setExpenses(prev => prev.filter(item => item.id !== id));
            };

            return { expenses, addExpense, toggleDone, deleteItem };
        };

        // Component: LandmarkInfo (景點介紹查詢元件)
        const LandmarkInfo = ({ query }) => {
            const [info, setInfo] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);

            useEffect(() => {
                if (!query) return;

                const getInfo = async () => {
                    setLoading(true);
                    setError(null);
                    setInfo(null);
                    const result = await fetchLandmarkInfo(query);
                    if (result && result !== 'ERROR') {
                        setInfo(result);
                    } else {
                        setError("無法找到景點介紹或網路錯誤。");
                    }
                    setLoading(false);
                };
                getInfo();
            }, [query]);

            if (loading) {
                return (
                    <div className="flex items-center text-sm text-rose-500 mt-2">
                        <svg className="animate-spin -ml-1 mr-2 h-4 w-4 text-rose-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        正在查詢景點特色...
                    </div>
                );
            }
            
            if (error) {
                return <p className="text-xs text-red-500 mt-2">*{error}</p>;
            }

            if (info) {
                return (
                    <div className="mt-3 pt-3 border-t border-rose-100">
                        <p className="text-xs font-bold text-rose-600 mb-1">【景點特色】</p>
                        <p className="text-sm text-gray-700 leading-relaxed">{info}</p>
                    </div>
                );
            }

            return null;
        };
        
        // Component: EventCard (行程卡片)
        const EventCard = ({ event }) => (
            <div className="bg-white p-4 rounded-xl shadow-lg hover:shadow-xl transition duration-300 transform hover:scale-[1.01] border border-rose-100">
                <p className="text-sm font-semibold text-gray-800">{event.description}</p>
                {/* 只有當 event.landmark 為 true 且有 query 時才渲染景點介紹 */}
                {event.landmark && event.query && <LandmarkInfo query={event.query} />}
            </div>
        );

        // Component: ExpenseTracker (預算追蹤器)
        const ExpenseTracker = ({ rate, rateError, refreshRate, rateLoading }) => {
            const { expenses, addExpense, toggleDone, deleteItem } = useLocalExpenses();
            
            const [itemName, setItemName] = useState('');
            const [jpyValue, setJpyValue] = useState('');
            const [payerName, setPayerName] = useState('我');
            
            const totalJPY = useMemo(() => expenses.reduce((sum, item) => sum + item.jpy, 0), [expenses]);
            const totalTWD = totalJPY * rate;
            
            // --- CRUD Operations ---
            const handleAddItem = (e) => {
                e.preventDefault();
                const name = itemName.trim();
                const payer = payerName.trim() || '未指定';
                const jpy = parseFloat(jpyValue);

                if (name === '' || isNaN(jpy) || jpy <= 0) return;
                
                addExpense({ name, jpy, payerName: payer });

                setItemName('');
                setJpyValue('');
                setPayerName('我');
            };
            
            const handleToggleDone = (id, isDone) => {
                toggleDone(id, isDone);
            };

            const handleDeleteItem = (id) => {
                deleteItem(id);
            };
            
            // --- Export to CSV Function ---
            const exportToCSV = () => {
                if (expenses.length === 0) {
                    console.log('清單中沒有花費項目可供匯出！'); // Log instead of alert
                    return;
                }

                const headers = ["日期", "項目名稱", "支付人員", "日幣金額 (JPY)", "台幣金額 (TWD)", "是否完成", "建立時間"];
                
                // Function to escape string content for CSV
                const escape = (str) => `"${String(str).replace(/"/g, '""')}"`;

                const csvContent = expenses.map(item => {
                    const twd = (item.jpy * rate).toFixed(2);
                    const dateStr = new Date(item.createdAt).toLocaleDateString('zh-TW');
                    const completed = item.isDone ? "是" : "否";
                    
                    return [
                        escape(dateStr), 
                        escape(item.name), 
                        escape(item.payerName || '未指定'), 
                        item.jpy, 
                        twd, 
                        completed,
                        escape(new Date(item.createdAt).toLocaleString('zh-TW'))
                    ].join(',');
                }).join('\n');

                // Add UTF-8 BOM for Chinese characters compatibility in Excel
                const fullCSV = "\uFEFF" + headers.join(',') + '\n' + csvContent;

                const blob = new Blob([fullCSV], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `關西姐妹淘花費明細_${new Date().toISOString().slice(0, 10)}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };


            return (
                <div id="expense-tracker" className="bg-white p-6 rounded-3xl shadow-2xl mb-8">
                    <h2 className="text-2xl font-bold text-rose-600 mb-4 flex items-center">
                        <svg className="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c1.657 0 3 .895 3 2s-1.343 2-3 2-3 .895-3 2 1.343 2 3 2m0-8V4m0 12v4m-6-3h12a2 2 0 002-2V7a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        旅費記帳本 (共 {expenses.length} 筆)
                    </h2>
                    
                    {/* Local Storage Warning */}
                    <div className="bg-yellow-50 p-4 rounded-xl mb-4 border border-yellow-200">
                        <p className="text-sm font-semibold text-yellow-800 flex items-center">
                            <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            本資料儲存在**您的瀏覽器中** (Local Storage)。
                        </p>
                        <p className="text-xs text-yellow-700 mt-1">
                            ⚠️ 換電腦或清空瀏覽器快取會遺失資料。若要同步到雲端，請聯繫平台管理員設定 Firebase。
                        </p>
                    </div>

                    {/* Exchange Rate Status (即時匯率功能區) */}
                    <div className="bg-indigo-50 p-4 rounded-xl mb-4 border border-indigo-200">
                        <div className="flex justify-between items-center">
                            <h3 className="text-lg font-bold text-indigo-600">即時匯率 (JPY → TWD)</h3>
                            <button 
                                onClick={refreshRate} 
                                disabled={rateLoading}
                                className={`text-sm px-3 py-1 rounded-full transition-colors ${rateLoading ? 'bg-gray-400' : 'bg-indigo-500 hover:bg-indigo-600'} text-white`}>
                                {rateLoading ? '更新中...' : '刷新匯率'}
                            </button>
                        </div>
                        <p className="text-2xl font-mono mt-2">
                            1 JPY = <span className="text-green-600 font-extrabold">NT$ {rate.toFixed(4)}</span>
                        </p>
                        <p className={`text-xs mt-1 ${rateError ? 'text-red-500' : 'text-gray-500'}`}>
                            {rateError || `匯率已更新至 ${new Date().toLocaleTimeString('zh-TW')}`}
                        </p>
                    </div>

                    {/* Total Display */}
                    <div className="bg-pink-500 text-white p-4 rounded-xl mb-6 shadow-inner">
                        <p className="text-md font-semibold mb-1">總花費概估</p>
                        <div className="flex justify-between items-baseline">
                            <span className="text-4xl font-extrabold text-yellow-300">
                                NT$ {(totalTWD).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}
                            </span>
                            <span className="text-lg font-bold">
                                ¥ {totalJPY.toLocaleString('en-US')}
                            </span>
                        </div>
                    </div>

                    {/* Add Item Form */}
                    <form onSubmit={handleAddItem} className="space-y-3 p-4 bg-rose-50 rounded-xl mb-6 shadow-md border border-rose-200">
                        <h3 className="text-lg font-bold text-gray-700">新增花費項目</h3>
                        <input
                            type="text"
                            placeholder="項目名稱 (e.g. 和牛大餐)"
                            className="w-full p-3 border border-rose-300 rounded-lg focus:ring-rose-500 focus:border-rose-500 text-sm"
                            value={itemName}
                            onChange={(e) => setItemName(e.target.value)}
                            required
                        />
                        <div className="grid grid-cols-2 gap-3">
                            <input
                                type="text"
                                placeholder="支付人員 (e.g. 雅雅)"
                                className="w-full p-3 border border-rose-300 rounded-lg focus:ring-rose-500 focus:border-rose-500 text-sm"
                                value={payerName}
                                onChange={(e) => setPayerName(e.target.value)}
                                required
                            />
                            <input
                                type="number"
                                placeholder="日幣金額 (JPY)"
                                className="w-full p-3 border border-rose-300 rounded-lg focus:ring-rose-500 focus:border-rose-500 text-sm"
                                value={jpyValue}
                                onChange={(e) => setJpyValue(e.target.value)}
                                min="1"
                                required
                            />
                        </div>
                        <button type="submit" className="w-full p-3 bg-rose-500 text-white font-semibold rounded-lg shadow-md hover:bg-rose-600 transition duration-150 transform hover:scale-[1.01]">
                            <span className="flex items-center justify-center">
                                <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                加入花費
                            </span>
                        </button>
                    </form>
                    
                    {/* Export Button */}
                    <div className="flex justify-end mb-4">
                        <button 
                            onClick={exportToCSV}
                            className="px-4 py-2 bg-green-500 text-white font-semibold rounded-lg shadow-md hover:bg-green-600 transition duration-150 transform hover:scale-[1.01] text-sm">
                            <span className="flex items-center">
                                <svg className="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                匯出 Excel (CSV)
                            </span>
                        </button>
                    </div>

                    {/* Expense List */}
                    <ul className="space-y-3 hide-scrollbar max-h-96 overflow-y-auto">
                        {expenses.length === 0 ? (
                            <p className="text-gray-500 p-4 text-center bg-gray-50 rounded-lg shadow-inner">清單是空的！新增第一筆花費吧！</p>
                        ) : (
                            expenses.map(item => (
                                <li key={item.id} className={`flex items-center justify-between p-3 rounded-xl shadow-sm transition-all border ${item.isDone ? 'bg-gray-100 opacity-70 border-gray-300 line-through' : 'bg-white border-rose-100 hover:shadow-md'}`}>
                                    <div className="flex items-center flex-grow">
                                        <input
                                            type="checkbox"
                                            className="toggle-checkbox h-5 w-5 text-rose-600 rounded border-gray-300 focus:ring-rose-500 cursor-pointer"
                                            checked={item.isDone}
                                            onChange={(e) => handleToggleDone(item.id, e.target.checked)}
                                        />
                                        <div className="ml-3 flex-1">
                                            <p className={`text-base font-semibold text-gray-800 ${item.isDone ? 'text-gray-500' : ''}`}>{item.name}</p>
                                            <p className="text-xs text-gray-500">
                                                支付者: <span className="font-bold text-indigo-500">{item.payerName}</span>
                                            </p>
                                        </div>
                                    </div>
                                    <div className="text-right ml-4 flex-shrink-0">
                                        <p className="text-lg font-extrabold text-red-600">
                                            NT$ {(item.jpy * rate).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}
                                        </p>
                                        <p className="text-xs font-mono text-gray-500">
                                            ¥ {item.jpy.toLocaleString('en-US')}
                                        </p>
                                    </div>
                                    <button 
                                        onClick={() => handleDeleteItem(item.id)} 
                                        className="ml-3 p-1 text-red-500 hover:bg-red-100 rounded-full transition-colors"
                                        aria-label="刪除項目">
                                        <svg className="h-4 w-4" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fillRule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 011-1h4a1 1 0 110 2H8a1 1 0 01-1-1zm6 3a1 1 0 100 2h-4a1 1 0 100-2h4z" clipRule="evenodd"></path></svg>
                                    </button>
                                </li>
                            ))
                        )}
                    </ul>
                </div>
            );
        };
        
        // Component: App (Main Layout)
        const App = () => {
            const [activeDay, setActiveDay] = useState(tripData[0].day);
            
            // State for Exchange Rate
            const [exchangeRate, setExchangeRate] = useState(DEFAULT_JPY_TO_TWD_RATE);
            const [rateError, setRateError] = useState(null);
            const [rateLoading, setRateLoading] = useState(false);

            const findRate = async () => {
                const ratePrompt = "Get the current JPY to TWD exchange rate.";
                const rateSystem = "You are a specialized currency assistant. Your only job is to find the JPY to TWD exchange rate and output only the numerical value of the rate, with no text explanation, no currency symbols, and no formatting (e.g., 0.2154). If you cannot find a current rate, respond with 'ERROR'.";

                const rateText = await callGeminiApi(ratePrompt, rateSystem);
                const numericalRate = parseFloat(rateText);

                // Basic validation for rate
                if (!isNaN(numericalRate) && numericalRate > 0.05 && numericalRate < 0.5) { 
                    setExchangeRate(numericalRate);
                    setRateError(null);
                } else {
                    setExchangeRate(DEFAULT_JPY_TO_TWD_RATE);
                    setRateError(`無法取得最新匯率，使用預設值 ${DEFAULT_JPY_TO_TWD_RATE}`);
                }
            };
            
            const refreshRate = useCallback(async () => {
                setRateLoading(true);
                await findRate();
                setRateLoading(false);
            }, []);

            useEffect(() => {
                refreshRate();
            }, [refreshRate]);


            // Find the active day's data
            const currentDay = tripData.find(d => d.day === activeDay);

            return (
                <div className="max-w-xl mx-auto min-h-screen pb-4">
                    {/* Header */}
                    <header className="py-6 px-4 bg-white shadow-lg sticky top-0 z-20 rounded-b-3xl mb-4">
                        <h1 className="text-3xl font-extrabold text-pink-700">
                            🌸 關西姊妹淘七日悠閒之旅
                        </h1>
                        <p className="text-sm text-gray-500 mt-1">
                            2026年 5月10日 (六) ～ 5月16日 (五)
                        </p>
                    </header>

                    <main className="px-4 space-y-8">
                        
                        {/* Trip Introduction */}
                        <div className="bg-white p-6 rounded-3xl shadow-2xl border border-pink-200">
                            <h2 className="text-2xl font-bold text-pink-600 mb-3 flex items-center">
                                <svg className="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                行程總覽 (簡介)
                            </h2>
                            <p className="text-gray-700 leading-relaxed text-sm">{TRIP_SUMMARY}</p>
                            <p className="mt-3 text-xs text-gray-500 italic">住宿：全程連住東橫INN 大阪難波西（或難波周邊飯店）</p>
                        </div>

                        {/* Day Tabs */}
                        <div className="hide-scrollbar overflow-x-auto whitespace-nowrap py-3 sticky top-24 bg-rose-50 z-10 -mx-4 px-4 shadow-inner">
                            {tripData.map(day => (
                                <button
                                    key={day.day}
                                    onClick={() => setActiveDay(day.day)}
                                    className={`inline-block px-4 py-2 mx-1 rounded-full text-sm font-semibold transition-all shadow-md transform hover:scale-[1.05] ${
                                        day.day === activeDay 
                                            ? 'bg-rose-500 text-white shadow-rose-400/50' 
                                            : 'bg-white text-rose-600 border border-rose-200 hover:bg-rose-100'
                                    }`}
                                >
                                    Day {day.day}
                                </button>
                            ))}
                        </div>

                        {/* Current Day Itinerary */}
                        <div key={activeDay} className="fade-in bg-white p-6 rounded-3xl shadow-2xl">
                            <h2 className="text-3xl font-bold text-gray-800 mb-2">{currentDay.title}</h2>
                            <p className="text-md font-semibold text-rose-500 mb-4">
                                {currentDay.date} @ {currentDay.location}
                            </p>
                            
                            {/* Weather Card */}
                            <div className="flex items-center bg-indigo-50 p-3 rounded-xl mb-6 shadow-inner border border-indigo-200">
                                <svg className="w-6 h-6 text-indigo-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                                <span className="text-sm font-medium text-indigo-800">天氣預報 (模擬): {currentDay.weather}</span>
                            </div>

                            {/* Timeline */}
                            <div className="relative border-l-2 border-rose-100 ml-3 space-y-8 my-6">
                                {currentDay.events.map((event, idx) => (
                                    <div key={idx} className="relative pl-8">
                                        <div className="absolute -left-[9px] top-0 w-4 h-4 rounded-full bg-rose-500 border-4 border-rose-100 shadow-lg"></div>
                                        <span className="inline-block px-2 py-0.5 rounded-full bg-rose-100 text-rose-600 text-xs font-bold mb-1 shadow-sm">
                                            {event.time}
                                        </span>
                                        {/* EventCard 包含了景點介紹的子元件 LandmarkInfo */}
                                        <EventCard event={event} />
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Expense Tracker Section */}
                        <ExpenseTracker 
                            rate={exchangeRate} 
                            rateError={rateError} 
                            refreshRate={refreshRate}
                            rateLoading={rateLoading}
                        />

                        {/* Footer */}
                        <div className="text-center text-rose-300 text-xs pb-10">
                            Made with ❤️ for Sisters Trip 2026
                            <br/>模擬天氣數據僅供參考，景點資訊與即時匯率由網路查詢提供。
                        </div>

                    </main>
                </div>
            );
        };

        // Render the App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
