<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關西七日悠閒之旅</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts - Zen Maru Gothic -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #fff1f2; /* Rose-50 */
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;

        // --- 匯率配置 ---
        const DEFAULT_RATE = 0.2150; 
        // ----------------

        // Firebase/環境變數初始化 (保持強健的解析邏輯)
        let firebaseConfig = null;
        if (typeof __firebase_config !== 'undefined') {
            try {
                firebaseConfig = JSON.parse(__firebase_config);
            } catch (e) {
                console.error("Warning: Could not parse __firebase_config. Proceeding with static content.", e);
            }
        }
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        // --------------------------------------------------------

        /**
         * 關西七日悠閒之旅 行程表 (Day 1 - Day 7)
         * 包含模擬的每日天氣預報。
         */
        const initialItinerary = [
            {
                day: 1,
                date: "星期六 (5/10)",
                theme: "抵達與震撼獅子頭",
                weather: { temp: "18°C / 25°C", icon: "☀️", condition: "晴朗，舒適" },
                events: [
                    { time: "08:55", name: "飛機抵達關西機場", description: "08:55-12:30：飛機抵達關西機場，準備入境。", location: "KIX" },
                    { time: "13:30", name: "搭乘南海電鐵 Rapi:t", description: "直達難波站。", location: "難波" },
                    { time: "15:00", name: "飯店 Check-in", description: "飯店 Check-in（放行李、補妝）。住宿：東橫INN 大阪難波西。", location: "難波" },
                    { time: "16:00", name: "難波八阪神社 🦁", description: "走路去被巨大的獅子頭震撼一下，吸走厄運、招來好運（必拍！）。", location: "難波八阪神社" },
                    { time: "18:00", name: "道頓堀 & 心齋橋 晚餐", description: "一蘭拉麵 或 章魚燒。跟固力果跑跑人看板合照。", location: "道頓堀" },
                ]
            },
            {
                day: 2,
                date: "星期日 (5/11)",
                theme: "京都經典：千本鳥居 & 清水舞台",
                weather: { temp: "17°C / 23°C", icon: "🌤️", condition: "多雲，偶爾有陽光" },
                events: [
                    { time: "09:00", name: "從難波出發前往京都", description: "搭乘 JR 或其他交通工具前往京都。", location: "京都" },
                    { time: "10:00", name: "伏見稻荷大社 ⛩️", description: "走進綿延不絕的紅色千本鳥居隧道。", location: "伏見稻荷" },
                    { time: "12:00", name: "錦市場 (午餐)", description: "京都的廚房，邊走邊吃（豆乳甜甜圈、三木雞卵、炸魚板）。", location: "錦市場" },
                    { time: "14:00", name: "清水寺 & 二三年坂 🏯", description: "著名的清水舞台、音羽瀑布。順路逛二三年坂的老街小店。", location: "清水寺" },
                    { time: "16:00", name: "星巴克京都二寧坂茶屋店", description: "推薦下午茶，體驗榻榻米座位。", location: "二寧坂" },
                    { time: "19:00", name: "回到大阪難波吃晚餐", description: "返回大阪難波，自由選擇晚餐地點。", location: "難波" },
                ]
            },
            {
                day: 3,
                date: "星期一 (5/12)",
                theme: "海之京都：天橋立 & 伊根舟屋 (跟團)",
                weather: { temp: "15°C / 20°C", icon: "🌧️", condition: "有陣雨，氣溫稍涼" },
                events: [
                    { time: "07:20", name: "難波集合 (跟團)", description: "難波集合 (OCAT 或 VIP Villa，視報名的團而定)。", location: "難波集合點" },
                    { time: "上午", name: "天橋立 🚠", description: "搭纜車上「飛龍觀」，彎腰從跨下看飛龍在天的絕景。", location: "天橋立" },
                    { time: "下午", name: "伊根舟屋 🛥️", description: "搭乘遊覽船，欣賞浮在水面上的舟屋群，還可以餵海鷗。", location: "伊根" },
                    { time: "18:30", name: "巴士回到難波解散", description: "結束一日遊行程。", location: "難波" },
                    { time: "晚餐", name: "簡單晚餐，早點休息", description: "在飯店附近便利商店或吉野家簡單吃，早點休息。", location: "難波" },
                ]
            },
            {
                day: 4,
                date: "星期二 (5/13)",
                theme: "神戶優雅行：花園與夜景",
                weather: { temp: "19°C / 26°C", icon: "☀️", condition: "晴朗，適合戶外活動" },
                events: [
                    { time: "10:00", name: "前往神戶三宮", description: "搭阪神電車前往神戶三宮。", location: "神戶三宮" },
                    { time: "10:30", name: "神戶布引香草園 🌸", description: "搭乘夢幻空中纜車上山，看海景、聞花香，非常療癒。", location: "神戶" },
                    { time: "14:00", name: "北野異人館街 🏠", description: "參觀風見雞之館、萌黃之館（充滿異國風情的洋房）。", location: "北野異人館街" },
                    { time: "16:00", name: "神戶港 Mosaic 廣場 🎡", description: "看麵包超人博物館(外觀)、神戶塔點燈。", location: "神戶港" },
                    { time: "18:00", name: "欣賞神戶百萬夜景", description: "欣賞著名的神戶百萬夜景，後返回難波。", location: "神戶港" },
                ]
            },
            {
                day: 5,
                date: "星期三 (5/14)",
                theme: "旗艦購物 & 黑毛和牛之夜",
                weather: { temp: "20°C / 28°C", icon: "🌥️", condition: "局部多雲，白天炎熱" },
                events: [
                    { time: "11:00", name: "梅田商圈 (Grand Front Osaka) 🛍️", description: "目標：【無印良品 關西旗艦店】 (北館 4F)，關西最大間！", location: "梅田" },
                    { time: "15:30", name: "戰利品拿回難波飯店放", description: "先把戰利品拿回難波飯店放，減輕負重。", location: "難波" },
                    { time: "16:30", name: "心齋橋補貨", description: "藥妝、Uniqlo、零食等。", location: "心齋橋" },
                    { time: "19:30", name: "晚餐：黑毛和牛大餐 🥩", description: "推薦：松阪牛燒肉 M (法善寺橫丁) 或 燒肉力丸。務必提前一個月訂位！", location: "法善寺橫丁" },
                ]
            },
            {
                day: 6,
                date: "星期四 (5/15)",
                theme: "老大阪風情：市場與通天閣",
                weather: { temp: "16°C / 22°C", icon: "🌦️", condition: "陰天轉陣雨" },
                events: [
                    { time: "10:00", name: "黑門市場 🦀 (早午餐)", description: "現烤扇貝、海膽、神戶牛串燒、水果大福。", location: "黑門市場" },
                    { time: "12:30", name: "千日前道具街 🍳", description: "看看超逼真的食物模型、日本製的精緻廚具。", location: "千日前" },
                    { time: "15:00", name: "新世界 & 通天閣 🗼", description: "充滿昭和復古味，誇張的立體招牌。", location: "新世界" },
                    { time: "16:00", name: "點心：大阪炸串", description: "必吃 大阪炸串 (Kushikatsu)，推薦「達摩炸串」。", location: "新世界" },
                    { time: "晚餐", name: "道頓堀最後巡禮 (大阪燒)", description: "在道頓堀享受最後一次經典大阪燒。", location: "道頓堀" },
                ]
            },
            {
                day: 7,
                date: "星期五 (5/16)",
                theme: "收心回家",
                weather: { temp: "18°C / 24°C", icon: "🌤️", condition: "多雲，舒適，適合搭機" },
                events: [
                    { time: "09:30", name: "退房與行李寄放", description: "退房，行李可寄放飯店或拉至車站寄放。", location: "難波" },
                    { time: "10:00", name: "悠閒早餐", description: "難波周邊找間咖啡廳享用悠閒早餐。", location: "難波" },
                    { time: "11:30", name: "搭乘南海電鐵 前往關西機場", description: "前往 KIX。", location: "難波" },
                    { time: "13:30", name: "搭機返台", description: "帶著滿滿回憶（和戰利品）回家！", location: "KIX" },
                ]
            }
        ];

        // --- Utility Components ---

        const Header = ({ title }) => (
            <header className="bg-rose-500 text-white p-4 shadow-lg sticky top-0 z-10 rounded-b-xl">
                <h1 className="text-xl font-bold text-center tracking-wider">{title}</h1>
            </header>
        );

        const DaySelector = ({ days, activeDay, setActiveDay }) => (
            <div className="flex overflow-x-auto hide-scrollbar p-3 space-x-2 bg-rose-100/50 shadow-inner sticky top-14 z-10">
                {days.map((dayData) => (
                    <button
                        key={dayData.day}
                        onClick={() => setActiveDay(dayData.day)}
                        className={`
                            px-4 py-2 text-sm font-semibold rounded-full whitespace-nowrap transition-all duration-300
                            ${activeDay === dayData.day
                                ? 'bg-rose-500 text-white shadow-md transform scale-105'
                                : 'bg-white text-rose-600 hover:bg-rose-200/80'
                            }
                        `}
                    >
                        Day {dayData.day} <span className="text-xs">({dayData.date.split(' ')[0]})</span>
                    </button>
                ))}
            </div>
        );

        const EventCard = ({ event }) => (
            <div className="bg-white p-4 rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-330 relative z-0 border-t-4 border-rose-400">
                <h3 className="text-lg font-bold text-gray-800 mb-1">{event.name}</h3>
                <p className="text-sm text-gray-600 mb-2">{event.description}</p>
                {event.location && (
                    <div className="flex items-center text-xs text-rose-500 font-medium bg-rose-50 px-2 py-1 rounded-full w-fit">
                        <span className="mr-1">📍</span> {event.location}
                    </div>
                )}
            </div>
        );

        // --- Currency Converter Component (Manual Mode) ---
        const CurrencyConverter = () => {
            const [manualRate, setManualRate] = useState(DEFAULT_RATE);
            const [jpyAmount, setJpyAmount] = useState(10000);
            
            const handleRateChange = (e) => {
                const value = e.target.value;
                if (value === '' || !isNaN(parseFloat(value))) {
                    setManualRate(value);
                }
            };
            
            const handleJpyAmountChange = (e) => {
                setJpyAmount(e.target.value);
            };

            const convertedTwd = useMemo(() => {
                const rate = parseFloat(manualRate);
                const amount = parseFloat(jpyAmount);

                if (rate > 0 && !isNaN(amount) && amount >= 0) {
                    // 使用逗號格式化，並保持四位小數
                    return (amount * rate).toFixed(4).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
                }
                return '0.0000';
            }, [jpyAmount, manualRate]);

            return (
                <div className="p-4 mb-6 bg-white rounded-2xl shadow-xl border border-pink-300 animate-fade-in">
                    <div className="flex justify-between items-start mb-3 border-b pb-2">
                        <h2 className="text-lg font-bold text-pink-600 flex items-center">
                            <span className="text-xl mr-2">💱</span> 匯率設定與轉換 (手動模式)
                        </h2>
                    </div>

                    <div className="mb-4 p-3 bg-pink-50 rounded-lg border border-pink-200">
                        <label className="block text-sm font-medium text-pink-700 mb-1">
                            1 JPY 兌換 TWD 匯率 (可編輯)
                        </label>
                        <div className="flex items-center">
                            <span className="text-sm font-bold text-gray-600 mr-2">1 JPY = </span>
                            <input
                                type="number"
                                inputMode="decimal"
                                step="0.0001"
                                value={manualRate}
                                onChange={handleRateChange}
                                className="w-24 p-2 border border-pink-300 rounded-lg text-base text-gray-800 focus:outline-none focus:border-pink-500 transition duration-150"
                                placeholder="0.0000"
                            />
                            <span className="text-sm font-bold text-gray-600 ml-2"> TWD</span>
                        </div>
                        <p className="text-xs text-gray-500 mt-1">
                            * 請自行輸入您目前使用的日幣匯率，例如：0.2150
                        </p>
                    </div>

                    <div className="flex flex-col sm:flex-row items-center space-y-3 sm:space-y-0 sm:space-x-3">
                        {/* JPY Input */}
                        <div className="flex items-center w-full sm:w-1/2">
                            <input
                                type="number"
                                inputMode="numeric"
                                pattern="[0-9]*"
                                value={jpyAmount}
                                onChange={handleJpyAmountChange}
                                className="w-full p-2 border border-pink-300 rounded-l-lg text-base text-gray-800 focus:outline-none focus:border-pink-500 transition duration-150"
                                placeholder="日幣金額"
                                min="0"
                            />
                            <span className="p-2 bg-pink-500 text-white rounded-r-lg font-bold text-sm">JPY</span>
                        </div>

                        {/* Result Display */}
                        <div className="flex items-center w-full sm:w-1/2 justify-between p-2 bg-pink-50 rounded-lg border border-pink-200 shadow-inner">
                            <span className="text-sm text-gray-700">TWD 約:</span>
                            <span className="text-xl font-extrabold text-rose-700">
                                {convertedTwd}
                            </span>
                        </div>
                    </div>
                </div>
            );
        };
        // --- End Currency Converter Component ---


        // --- Main App Component ---
        const App = () => {
            const [activeDay, setActiveDay] = useState(initialItinerary[0].day);
            
            // 根據選中的 Day 找出對應的行程資料
            const currentDay = initialItinerary.find(d => d.day === activeDay);

            return (
                <div className="min-h-screen">
                    <Header title="關西姊妹淘七日悠閒之旅 (每日天氣/匯率版)" />

                    <DaySelector 
                        days={initialItinerary} 
                        activeDay={activeDay} 
                        setActiveDay={setActiveDay} 
                    />

                    <main className="p-4 max-w-xl mx-auto">
                        
                        {/* 1. Currency Converter (Manual Mode) */}
                        <CurrencyConverter />
                        
                        {/* 2. Itinerary Details - 整合每日天氣到標題 */}
                        {currentDay && (
                            <div className="bg-white p-4 rounded-2xl shadow-xl mb-6 animate-fade-in border-t-4 border-rose-500">
                                <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-2 pb-2 border-b border-rose-100">
                                    {/* 左側: Day & Theme */}
                                    <h2 className="text-2xl font-bold text-rose-700">
                                        Day {currentDay.day}: {currentDay.theme}
                                    </h2>
                                    
                                    {/* 右側: 每日天氣 */}
                                    <div className="mt-2 sm:mt-0 flex items-center text-lg font-semibold text-blue-600 bg-blue-50/70 px-3 py-1 rounded-full shadow-sm">
                                        <span className="text-2xl mr-2">{currentDay.weather.icon}</span> 
                                        {currentDay.weather.temp}
                                    </div>
                                </div>

                                <p className="text-sm text-gray-500 mb-4">{currentDay.date} / {currentDay.weather.condition}</p>

                                {/* Timeline */}
                                <div className="relative border-l-2 border-rose-100 ml-3 space-y-8 my-6">
                                    {currentDay.events.map((event, idx) => (
                                        <div key={idx} className="relative pl-8">
                                            <div className="absolute -left-[9px] top-0 w-4 h-4 rounded-full bg-rose-500 border-4 border-rose-100"></div>
                                            <span className="inline-block px-2 py-0.5 rounded bg-rose-100 text-rose-600 text-xs font-bold mb-1 shadow-sm">
                                                {event.time}
                                            </span>
                                            <EventCard event={event} />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Footer */}
                        <div className="text-center text-rose-300 text-xs pb-10">
                            Made with ❤️ for Sisters Trip 2026
                            <br/>每日天氣為模擬預報數據，僅供參考。
                        </div>


                    </main>
                </div>
            );
        };

        // Standard React Bootstrap
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>
</body>
</html>
