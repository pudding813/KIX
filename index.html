                Flame: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.1.2-2.2.5-3.3.3-1.09.77-2.127 1.45-3.05a2.5 2.5 0 0 0 .55 2.85Z"/></svg>,
                Coffee: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></svg>,
                LogOut: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
                ChevronDown: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m6 9 6 6 6-6"/></svg>,
                ChevronUp: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m18 15-6-6-6 6"/></svg>,
            };
            return icons[name] || icons['MapPin']; 
        };

        const WeatherWidget = ({ weather, temp }) => {
            // Weather icon SVG logic here (simplified for brevity, same as before)
            const WeatherIcon = ({type}) => {
                if(type === 'Sunny') return <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>;
                if(type === 'Cloudy') return <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><path d="M17.5 19c0-1.7-1.3-3-3-3h-11c-1.7 0-3 1.3-3 3s1.3 3 3 3h11c1.7 0 3-1.3 3-3Z"/><path d="M17.5 12a6.5 6.5 0 0 1 0 13h-11a6.5 6.5 0 0 1-0-13h.1a4.5 4.5 0 0 1 8.8 0h2.1Z"/></svg>;
                if(type === 'Rain') return <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></svg>;
                return <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><path d="M12 2v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="M20 12h2"/><path d="m19.07 4.93-1.41 1.41"/><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"/><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/></svg>;
            }

            const getBg = () => {
                if (weather === 'Sunny') return 'bg-orange-100 text-orange-600 border-orange-200';
                if (weather === 'Cloudy') return 'bg-slate-100 text-slate-600 border-slate-200';
                if (weather === 'Rain') return 'bg-blue-100 text-blue-600 border-blue-200';
                return 'bg-sky-100 text-sky-600 border-sky-200';
            }

            return (
                <div className={`flex items-center gap-2 px-3 py-1 rounded-full border text-sm font-bold ${getBg()}`}>
                    <WeatherIcon type={weather} />
                    <span>{temp}</span>
                </div>
            )
        }

        const Countdown = () => {
            const targetDate = new Date('2026-05-10T00:00:00');
            const [timeLeft, setTimeLeft] = useState(calculateTimeLeft());

            function calculateTimeLeft() {
                const difference = +targetDate - +new Date();
                let timeLeft = {};

                if (difference > 0) {
                    timeLeft = {
                        days: Math.floor(difference / (1000 * 60 * 60 * 24)),
                    };
                } else {
                    timeLeft = { days: 0 };
                }
                return timeLeft;
            }

            useEffect(() => {
                const timer = setTimeout(() => {
                    setTimeLeft(calculateTimeLeft());
                }, 1000);
                return () => clearTimeout(timer);
            });

            return (
                <div className="bg-white/80 backdrop-blur-sm rounded-lg p-3 mb-6 shadow-sm border border-rose-100 text-center">
                    <p className="text-rose-400 text-xs font-bold uppercase tracking-wider mb-1">距離出發還有</p>
                    <p className="text-3xl font-black text-rose-600">
                        {timeLeft.days} <span className="text-sm font-medium text-rose-400">天</span>
                    </p>
                </div>
            );
        };

        // New Event Card Component to handle toggle state
        const EventCard = ({ event }) => {
            const [isOpen, setIsOpen] = useState(false);

            return (
                <div className="bg-white rounded-xl p-4 shadow-sm border border-gray-50 mt-1 hover:shadow-md transition-shadow">
                    <div className="flex items-center gap-3 mb-2">
                        <div className="p-2 bg-rose-50 text-rose-500 rounded-lg shrink-0">
                            <Icon name={event.icon} className="w-5 h-5" />
                        </div>
                        <h3 className="font-bold text-gray-800">{event.title}</h3>
                    </div>
                    <p className="text-sm text-gray-500 leading-relaxed pl-[44px]">
                        {event.desc}
                    </p>
                    
                    {/* Toggle Button for Intro */}
                    {event.intro && (
                        <div className="pl-[44px] mt-3">
                            <button 
                                onClick={() => setIsOpen(!isOpen)}
                                className="flex items-center text-xs text-rose-500 font-bold hover:text-rose-600 transition-colors"
                            >
                                {isOpen ? '收起介紹' : '查看介紹'} 
                                <Icon name={isOpen ? "ChevronUp" : "ChevronDown"} className="w-3 h-3 ml-1" />
                            </button>
                            
                            {isOpen && (
                                <div className="mt-2 p-3 bg-rose-50 rounded-lg text-xs text-gray-600 leading-relaxed animate-fade-in">
                                    {event.intro}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [activeDay, setActiveDay] = useState(0);

            useEffect(() => {
                const el = document.getElementById(`day-btn-${activeDay}`);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }, [activeDay]);

            const currentDay = itineraryData[activeDay];

            return (
                <div className="max-w-md mx-auto min-h-screen bg-rose-50 pb-20 relative overflow-hidden">
                    {/* Background decoration */}
                    <div className="absolute top-0 left-0 w-full h-64 bg-gradient-to-b from-rose-200 to-rose-50 -z-10"></div>
                    <div className="absolute top-[-50px] right-[-50px] w-40 h-40 bg-rose-300 rounded-full blur-3xl opacity-30"></div>
                    
                    {/* Header */}
                    <header className="px-6 pt-10 pb-4">
                        <div className="flex justify-between items-start mb-4">
                            <div>
                                <h1 className="text-2xl font-black text-rose-900 leading-tight">關西姊妹淘<br/>七日悠閒之旅</h1>
                                <p className="text-rose-700 text-sm mt-1 font-medium">2026.05.10 - 05.16</p>
                            </div>
                            <div className="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-lg border-2 border-rose-100 overflow-hidden">
                                <span className="text-2xl">🐶</span>
                            </div>
                        </div>

                        <Countdown />

                        <div className="flex items-center justify-between">
                            <div className="flex items-center text-rose-800 font-bold">
                                <Icon name="MapPin" className="w-4 h-4 mr-1" />
                                {currentDay.location}
                            </div>
                            <WeatherWidget weather={currentDay.weather} temp={currentDay.temp} />
                        </div>
                    </header>

                    {/* Day Selector */}
                    <div className="sticky top-0 bg-rose-50/95 backdrop-blur-md z-20 py-2 border-b border-rose-100">
                        <div className="flex overflow-x-auto px-6 gap-3 hide-scrollbar pb-2">
                            {itineraryData.map((day, index) => (
                                <button
                                    key={index}
                                    id={`day-btn-${index}`}
                                    onClick={() => setActiveDay(index)}
                                    className={`flex-shrink-0 flex flex-col items-center justify-center w-14 h-16 rounded-2xl transition-all duration-300 ${
                                        activeDay === index 
                                        ? 'bg-rose-500 text-white shadow-lg scale-105' 
                                        : 'bg-white text-rose-400 border border-rose-100'
                                    }`}
                                >
                                    <span className="text-xs font-medium">Day</span>
                                    <span className="text-lg font-bold">{day.day}</span>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Main Content */}
                    <main className="px-6 py-6 space-y-6">
                        
                        {/* Day Header */}
                        <div className="bg-white rounded-3xl p-6 shadow-sm border border-rose-100 animate-fade-in">
                            <h2 className="text-xl font-bold text-gray-800 mb-2">{currentDay.title}</h2>
                            <div className="flex items-center text-gray-500 text-sm mb-4">
                                <Icon name="Hotel" className="w-4 h-4 mr-2" />
                                <span>宿：{currentDay.stay}</span>
                            </div>
                            
                            {/* Timeline */}
                            <div className="relative border-l-2 border-rose-100 ml-3 space-y-8 my-6">
                                {currentDay.events.map((event, idx) => (
                                    <div key={idx} className="relative pl-8">
                                        <div className="absolute -left-[9px] top-0 w-4 h-4 rounded-full bg-rose-500 border-4 border-rose-100"></div>
                                        <span className="inline-block px-2 py-0.5 rounded bg-rose-100 text-rose-600 text-xs font-bold mb-1">
                                            {event.time}
                                        </span>
                                        <EventCard event={event} />
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Footer */}
                        <div className="text-center text-rose-300 text-xs pb-10">
                            Made with ❤️ for Sisters Trip 2026
                            <br/>Weather forecast is simulated based on historical data.
                        </div>

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
